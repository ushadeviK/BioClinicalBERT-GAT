# Central configuration parameters for reproducibility and model hyperparameters
reproducibility:
  random_seed: 42

training:
  batch_size: 16
  learning_rate: 0.00002
  num_epochs: 10
  max_seq_length: 128

model:
  name: "emilyalsentzer/Bio_ClinicalBERT"
  device: "cpu"

gat:
  num_layers: 2
  hidden_dim: 256
  dropout: 0.2
  num_classes: 5
